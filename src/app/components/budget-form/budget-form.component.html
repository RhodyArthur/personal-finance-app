<div class="card">
    <app-button text="+ Add New Budget" (click)="showDialog()"/>
    <p-dialog header= "{{budget() ? 'Edit Budget' : 'Add New Budget'}}" [modal]="true" [(visible)]="visible">
        
        <form [formGroup]="budgetForm" (ngSubmit)="onAddBudget()">
            <p>Update your Information</p>

            <div class="content">
                <app-select label="Budget Category" [options]="categories()" [(value)]="selectedCategory" (valueChange)="onCategorySelected($event)"></app-select>

                <div class="input-field">
                    <label for="maximum">Maximum Spending</label>
                    <input type="number" id="maximum" placeholder="$ e.g 20000" formControlName="maximum"/>
                </div>

                <p-select [options]="colorOptions()" [(ngModel)]="selectedColor" [ngModelOptions]="{standalone: true}" optionLabel="name" placeholder="Color Tags" class="w-full md:w-56"
                (onChange)="onColorSelected($event.value)">
                    <ng-template pTemplate="selectedItem" let-color>
                        <span>{{color.name}}</span>
                    </ng-template>

                    <ng-template pTemplate="item" let-color>
                        <div class="item">
                          <span class="circle" [style.backgroundColor]="color.value"></span>
                          <span>{{color.name}}</span>
                        </div>
                      </ng-template>
                </p-select>
            </div>

            <app-button text="{{budget() ? 'Save Changes' : 'Add Budget'}}"/>
        </form>

    </p-dialog>
</div>
