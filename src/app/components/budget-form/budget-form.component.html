
<form>
    <h2>Add New Budget</h2>

    <p>Update your Information</p>

    <div class="content">
        <app-select label="Budget Category" [options]="data.categories" [(value)]="selectedCategory" (valueChange)="onCategorySelected($event)"></app-select>

        <div class="input-field">
            <label for="maximum">Maximum Spending</label>
            <input type="number" id="maximum" placeholder="$ e.g 20000">
        </div>

        <div class="color">
            <label for="colors">Color Tags</label>
            <select id="colors">
                @for (color of colorOptions(); track $index) {

                    <option [value]="color.value">
                        <span class="circle" [style.backgroundColor]="color.value"></span>
                        <span class="name">{{color.name}}</span>
                    </option>
                }
            </select>
        </div>

        <p-select [options]="colorOptions()" [(ngModel)]="selectedColor" optionLabel="name" placeholder="Color Tags" class="w-full md:w-56">
            <ng-template pTemplate="selectedItem" let-color>
                <div class="flex align-items-center">
                  <span class="circle mr-2" [style.backgroundColor]="color.value"></span>
                  <span>{{color.name}}</span>
                </div>
              </ng-template>
        </p-select>
    </div>

    <app-button text="Add Budget"/>

</form>
