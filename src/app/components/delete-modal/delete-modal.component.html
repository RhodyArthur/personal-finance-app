<div class="card">
    <p-dialog header="Delete '{{selectedBudget()?.category}}'" [modal]="true" [(visible)]="visible">
        <span class="p-text-secondary block mb-8">
            Are you sure you want to delete this budget?
            This action cannot be reversed,
            and all the data inside it will be removed forever.
        </span>

        <app-button class="btn" text="Yes, Confirm Deletion" color="#C94736"/>

        <app-button class="btn" text="No, Go Back" color="#ffffff" textColor="#696868" (click)="visible=false"/>
        
    </p-dialog>
</div>
